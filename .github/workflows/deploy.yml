name: Deploy to GitHub Pages

# Publishes the built Astro site to GitHub Pages. The repo has GitHub Pages
# configured to "GitHub Actions" as the source, so this workflow drives the
# entire deploy pipeline — there's no legacy branch-based Pages publisher
# running in parallel.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Anti-slop design gate
        # Blocks default-LLM aesthetic/vocabulary drift (slop copy,
        # gradient-mesh CSS, radii past the 4px securanido contract cap)
        # from reaching the public site. Zero-dep; see the script header.
        run: python3 scripts/check-anti-slop.py

      - name: Build
        run: npm run build

      - name: Install accessibility test browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Accessibility gate
        run: npm run test:a11y

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./dist

  required-checks:
    name: Required checks
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce required results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success

  deploy:
    name: Deploy to Pages
    needs: [build, required-checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
